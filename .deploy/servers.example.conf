# The API servers, in the order a rollout walks them. Copy to servers.conf on the load balancer
# and fill in the real hosts; servers.conf is not in this repository.
#
# The variant is deliberately absent. Each server names its own in VARIANT in
# /opt/unipept-api/etc/unipept-api.env, so adding a server is one edit, not two.
#
# The backend field is a comma-separated list, because a server sits in every backend that routes
# to it. With the database endpoints routed separately, that is two, and a drain covers both.
#
# Order matters. Put a backup server first: it takes no traffic while the primaries are up, so it
# is the cheapest place to find out the release is bad.
#
# name   host              port  haproxy_backends           haproxy_server
rick     rick.ugent.be     8080  all_handlers,db_handlers   rick
patty    patty.ugent.be    8080  all_handlers,db_handlers   patty
selma    selma.ugent.be    8080  all_handlers,db_handlers   selma
