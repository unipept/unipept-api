# The API servers a rollout walks. Copy to servers.conf on the load balancer and fill in the real
# hosts; servers.conf is not in this repository.
#
# The variant is deliberately absent. Each server names its own in VARIANT in
# /opt/unipept-api/etc/unipept-api.env, so adding a server is one edit, not two.
#
# The backend field is a comma-separated list, because a server sits in every backend that routes to
# it. With the database endpoints routed separately that is two, and a drain covers both.
#
# Order here is the order primaries are updated in. Backup servers are moved to the end whatever this
# file says, read from HAProxy's own `bck` field: a backup takes no traffic while the primaries are
# up, so updating it first would put the fleet's fallback on an unproven binary.
#
# The port here is the one the network uses, which is 80 and matches HAProxy's own server lines.
# It is not the port the service binds: that is PORT in each server's environment file, above 1024,
# and a rule on the host sends 80 to it. The two are meant to differ.
#
# name   host              port  haproxy_backends           haproxy_server
patty    patty.ugent.be    80    all_handlers,db_handlers   patty
selma    selma.ugent.be    80    all_handlers,db_handlers   selma
rick     rick.ugent.be     80    all_handlers,db_handlers   rick
