global
    stats socket /run/haproxy/haproxy.sock mode 666 level admin
    stats timeout 30s

defaults
    log     global
    mode    http
    timeout connect 5s
    timeout client  30s
    timeout server  1800s

frontend handlers
    mode http
    bind *:8080
    default_backend all_handlers

backend all_handlers
    balance leastconn
    mode http
    option httpchk
    http-check send meth GET uri /health
    server patty 127.0.0.1:9101 check fall 100 maxconn 100
    server selma 127.0.0.1:9102 check fall 100 maxconn 100
    server rick  127.0.0.1:9103 check inter 10s fall 10 backup maxconn 100

backend db_handlers
    balance leastconn
    mode http
    option httpchk
    http-check send meth GET uri /health/database
    server patty 127.0.0.1:9101 check fall 100 maxconn 100
    server selma 127.0.0.1:9102 check fall 100 maxconn 100
    server rick  127.0.0.1:9103 check inter 10s fall 10 backup maxconn 100
