# Three ecosystems live in this repository: cargo (one lockfile at the root covers every
# workspace member), github-actions (the `uses:` pins in .github/workflows), and devcontainers
# (.devcontainer/devcontainer.json).
version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
      time: "13:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 99
    groups:
      # The crates of the one unipept-index repository move to the same commit.
      unipept-index:
        patterns:
          - binary-traits
          - fa-compression
          - protein-metadata
          - protein-text
          - sa-builder
          - sa-index
          - sa-server
      # Dependabot classifies a Cargo `0.y` minor update as major, so it gets its own PR.
      cargo-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    labels:
      - deps
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "13:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 99
    ignore:
      # The MSRV job pins this action to the workspace `rust-version`.
      - dependency-name: dtolnay/rust-toolchain
    labels:
      - deps
    commit-message:
      prefix: deps

  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: monthly
      time: "13:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 99
    labels:
      - deps
    commit-message:
      prefix: deps
