name: Backends

on: [push]

jobs:
  backends:
    # `cargo clippy --all-features` in the Lint workflow compiles exactly one of the nine
    # configurations. Sequential rather than a matrix: the combinations share one warm target
    # directory, where nine runners would each pay checkout, toolchain and cache restore first.
    name: Check every storage backend
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check every backend combination
        shell: bash
        run: |
          set -euo pipefail
          for features in "" "mmap" "mmap,preloaded-text" "mmap,preloaded-proteins" \
                          "mmap,preloaded-mapping" "mmap,preloaded-text,preloaded-proteins" \
                          "mmap,preloaded-text,preloaded-mapping" \
                          "mmap,preloaded-proteins,preloaded-mapping" \
                          "mmap,preloaded-text,preloaded-proteins,preloaded-mapping"; do
            echo "== ${features:-(none)} =="
            if [ -z "$features" ]; then
              cargo check --all-targets -p unipept-api
            else
              cargo check --all-targets -p unipept-api --features "$features"
            fi
          done
