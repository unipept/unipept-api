# The suites in .deploy/tests, which run the deploy scripts against a real systemd and a real
# HAProxy in containers. Separate from ci.yml because of the path filter: these read nothing outside
# .deploy, so running them on a pull request that changes only Rust is several minutes spent proving
# nothing.
#
# Path-filtered, so it does not run on every PR — do not add it to the ruleset as a required check,
# or PRs that touch no deploy script would wait forever for a check that never starts. Same reason
# as audit.yml.
#
# The server and load balancer suites are two jobs rather than one, because only the server suite
# needs a privileged container: a failure there says something different from a failure in the load
# balancer suites, and they are worth having even on a runner where systemd in a container turns
# out not to work. The library suite and the comparison of the shared files need no container, and share one.
name: Deploy tests

on:
  push:
    branches: [main]
    paths:
      - '.deploy/**'
      - '.github/workflows/deploy-tests.yml'
  pull_request:
    paths:
      - '.deploy/**'
      - '.github/workflows/deploy-tests.yml'
  workflow_dispatch:

# A force-push replaces its predecessor rather than racing it. Not on main: runs there are the
# record of what the branch did.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lib:
    # The parts of lib.sh, function by function, and the files shared with unipept-database. No
    # container, and done in seconds.
    #
    # lib/core.sh, the assertions and core.sh's cases are compared with unipept-database's copies: on
    # its branch of the same name where it has one, so two pull requests that change them together
    # pass together, and on its main otherwise.
    name: Library suite and shared files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run the library suite
        run: .deploy/tests/run-tests.sh lib

      # Even when the one above failed, so one run reports both.
      - name: Compare with unipept-database
        if: ${{ !cancelled() }}
        env:
          OTHER: unipept/unipept-database
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=main
          if git ls-remote --exit-code "https://github.com/${OTHER}" "refs/heads/${BRANCH}" > /dev/null; then
            ref=$BRANCH
          fi
          echo "Comparing with ${OTHER} at ${ref}"
          status=0
          while read -r here there; do
            if ! curl -fsSL "https://raw.githubusercontent.com/${OTHER}/${ref}/${there}" -o theirs; then
              echo "::error file=${here}::cannot fetch ${there} from ${OTHER} at ${ref}"
              status=1
            elif ! diff -u theirs "$here"; then
              echo "::error file=${here}::differs from ${there} in ${OTHER} at ${ref}"
              status=1
            fi
          done <<'FILES'
          .deploy/lib/core.sh .deploy/lib/core.sh
          .deploy/tests/assertions.sh tests/assertions.sh
          .deploy/tests/core-cases.sh tests/deploy/core-cases.sh
          FILES
          exit "$status"

  server:
    # install.sh and deploy.sh against systemd 255 on Ubuntu 24.04, with a real user manager and
    # lingering. The container runs --privileged with the host's cgroups mounted, which is what
    # systemd needs as pid 1.
    name: Server suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run the server suite
        run: .deploy/tests/run-tests.sh server

  loadbalancer:
    # haproxy.sh, rollout.sh and the load balancer install, against HAProxy 2.8 with two backends
    # over three servers. No privilege needed.
    #
    # One step per suite, so the job's own log says which of the three failed before anything is
    # opened.
    name: Load balancer suites
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run the HAProxy suite
        run: .deploy/tests/run-tests.sh haproxy

      - name: Run the rollout suite
        run: .deploy/tests/run-tests.sh rollout

      - name: Run the load balancer install suite
        run: .deploy/tests/run-tests.sh lb-install
