[workspace]
# Explicit: a virtual root infers no resolver from its members' editions and silently falls back
# to 1. Resolver 3 prefers dependency versions each member's own rust-version can build.
resolver = "3"

members = [
    "api",
    "database",
    "datastore",
    "fixtures",
    "index"
]

# fixtures is test-only: kept out of the default set so a release build never compiles it.
default-members = [
    "api",
    "database",
    "datastore",
    "index"
]

# The floor the unipept-index dependency already imposes; 1.87 is refused outright.
[workspace.package]
edition = "2024"
rust-version = "1.88"
