[package]
name = "unipept-api"
version = "2.4.2"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
askama = "0.16.1"
axum = { version = "0.8.9", features = ["macros", "form", "multipart"] }
clap = { version = "4.5.1", features = ["derive"] }
database = { path = "../database" }
datastore = { path = "../datastore" }
form_urlencoded = "1.2.2"
http-body-util = "0.1.2"
index = { path = "../index" }
paste = "1.0.15"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"
serde_qs = "1.1.3"
thiserror = "2.0"
tokio = { version = "1.44.2", features = ["rt", "rt-multi-thread", "macros"] }
tower = { version = "0.5.3", features = ["timeout"] }
tower-http = { version = "0.6.8", features = ["cors", "trace", "limit", "normalize-path"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
http = "1.1.0"
tower-layer = "0.3.2"
tower-service = "0.3.2"
itertools = "0.15.0"
reqwest = { version = "0.13.2", features = [ "json" ] }

# Storage backend, forwarded to sa-server via `index`.
[features]
mmap = ["index/mmap"]
preloaded-text = ["index/preloaded-text"]
preloaded-proteins = ["index/preloaded-proteins"]
preloaded-mapping = ["index/preloaded-mapping"]

[dev-dependencies]
bytes = "1"
criterion = "0.8.2"
futures-util = "0.3"
fixtures = { path = "../fixtures", features = ["index-builder"] }
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }
httpmock = "0.7"

[[bench]]
opt-level = 0
name = "bench_main"
harness = false

[profile.bench]
opt-level=3
