[package]
name = "database"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# rustls, not native-tls: this crate's default links libssl at runtime.
opensearch = { version = "^2.0.0", default-features = false, features = ["rustls-tls"] }
itertools = "0.15.0"
thiserror = "2.0"
url = "2.5.4"
serde = "~1"
serde_json = "~1"

[dev-dependencies]
fixtures = { path = "../fixtures" }
httpmock = "0.7"
# Test-only: the crate itself never names tokio, and the tests need only #[tokio::test].
tokio = { version = "1.44.2", features = ["macros", "rt"] }
