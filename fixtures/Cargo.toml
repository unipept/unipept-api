[package]
name = "fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
datastore = { path = "../datastore" }
binary-traits = { git = "https://github.com/unipept/unipept-index.git", optional = true }
protein-metadata = { git = "https://github.com/unipept/unipept-index.git", optional = true }
protein-text = { git = "https://github.com/unipept/unipept-index.git", optional = true }
sa-builder = { git = "https://github.com/unipept/unipept-index.git", optional = true }
sa-index = { git = "https://github.com/unipept/unipept-index.git", optional = true }

# Optional, so a release build never compiles them.
[features]
index-builder = ["dep:binary-traits", "dep:protein-metadata", "dep:protein-text", "dep:sa-builder", "dep:sa-index"]
