[package]
name = "index"
version = "2.3.2"
edition = "2021"

[dependencies]
sa-server = { git = "https://github.com/unipept/unipept-index.git", rev = "718a81e8285d9889839710129389575efe55014a" }
sa-index = { git = "https://github.com/unipept/unipept-index.git", rev = "718a81e8285d9889839710129389575efe55014a" }
fa-compression = { git = "https://github.com/unipept/unipept-index.git", rev = "718a81e8285d9889839710129389575efe55014a" }
thiserror = "1.0"

# Storage backend, forwarded to sa-server. No features = fully preloaded.
[features]
mmap = ["sa-server/mmap"]
preloaded-text = ["sa-server/preloaded-text"]
preloaded-proteins = ["sa-server/preloaded-proteins"]
preloaded-mapping = ["sa-server/preloaded-mapping"]
